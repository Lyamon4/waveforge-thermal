[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveforge-thermal"
version = "0.1.0"
description = "Neural microchannel cooling design with coupled flow and thermal evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.11,<3.12",
    "nlopt>=2.10,<2.11",
    "numpy>=2.4,<2.5",
    "pandas>=3.0,<3.1",
    "psutil>=7.2,<7.3",
    "pydantic>=2.13,<2.14",
    "PyYAML>=6.0,<7",
    "scipy>=1.17,<1.18",
    "torch>=2.13,<2.14",
    "tqdm>=4.70,<4.71",
]

[project.optional-dependencies]
accelerate = ["numba>=0.68,<0.69"]
solver-free = ["numba>=0.68,<0.69", "scikit-learn>=1.9,<1.10", "joblib>=1.6,<1.7", "threadpoolctl>=3.7,<3.8"]
demo = ["numba>=0.68,<0.69", "scikit-learn>=1.9,<1.10", "joblib>=1.6,<1.7", "threadpoolctl>=3.7,<3.8", "lightgbm>=4.7,<4.8"]
dev = [
    "pytest>=9.1,<9.2",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"waveforge.physics" = ["cuda_cg_kernel.cu"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
