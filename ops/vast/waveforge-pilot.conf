[program:waveforge-pilot]
command=/bin/bash /workspace/waveforge-thermal/ops/vast/run_campaign_phase.sh pilot
directory=/workspace/waveforge-thermal
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
environment=WAVEFORGE_REMAINING_HOURS="8.0"
stdout_logfile=/var/log/portal/waveforge-pilot.log
stderr_logfile=/var/log/portal/waveforge-pilot-error.log
