[program:waveforge-recovery]
command=/bin/bash /workspace/waveforge-thermal/ops/vast/run_campaign_phase.sh recovery
directory=/workspace/waveforge-thermal
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
environment=WAVEFORGE_REMAINING_HOURS="1.25"
stdout_logfile=/var/log/portal/waveforge-recovery.log
stderr_logfile=/var/log/portal/waveforge-recovery-error.log
