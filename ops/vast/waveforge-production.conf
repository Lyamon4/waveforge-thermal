[program:waveforge-production]
command=/bin/bash /workspace/waveforge-thermal/ops/vast/run_campaign_phase.sh production
directory=/workspace/waveforge-thermal
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
environment=WAVEFORGE_REMAINING_HOURS="6.0"
stdout_logfile=/var/log/portal/waveforge-production.log
stderr_logfile=/var/log/portal/waveforge-production-error.log
